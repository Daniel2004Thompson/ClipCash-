name: Release v6.0.0

on:
  workflow_run:
    workflows: ["Build Debug APK"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  actions: read

jobs:
  publish-release:
    name: Publish v6.0.0 GitHub Release
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: clipcash-debug-apk-v6.0.0
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: release-apk

      - name: Verify downloaded APK
        run: |
          if [ ! -f "release-apk/ClipCash-v6.0.0.apk" ]; then
            echo "Expected APK release-apk/ClipCash-v6.0.0.apk not found"
            ls -la release-apk || true
            exit 1
          fi

      - name: Delete existing v6.0.0 release and tag if present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "v6.0.0" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release delete "v6.0.0" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag
          fi
          gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/tags/v6.0.0" >/dev/null 2>&1 || true

      - name: Create v6.0.0 GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v6.0.0
          name: v6.0.0
          target_commitish: ${{ github.event.workflow_run.head_sha }}
          make_latest: true
          generate_release_notes: true
          files: release-apk/ClipCash-v6.0.0.apk
